<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2290" viewBox="0 0 1500 2290">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#e5e7eb"/>
  <rect x="24" y="24" width="1452" height="2242" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="58" cy="56" r="7" fill="#ef4444"/>
  <circle cx="82" cy="56" r="7" fill="#f59e0b"/>
  <circle cx="106" cy="56" r="7" fill="#22c55e"/>
  <text x="132" y="62" fill="#f8fafc" font-size="22" font-family="Arial, sans-serif" font-weight="700">知识库证据检索与召回打分</text>
  <text x="34" y="92" fill="#94a3b8" font-size="15" font-family="Arial, sans-serif">ClaimTrace processing modules</text>
  <g font-family="Consolas, monospace" font-size="16" xml:space="preserve">
    <style>.ln{fill:#64748b;text-anchor:end}</style>
<text x="34" y="112" class="ln"></text><text x="104" y="112" fill="#7dd3fc">// web/src/adapters/retrieval.ts</text>
<text x="34" y="136" class="ln">43</text><text x="104" y="136" fill="#e5e7eb">}</text>
<text x="34" y="160" class="ln">44</text><text x="104" y="160" fill="#e5e7eb"> </text>
<text x="34" y="184" class="ln">45</text><text x="104" y="184" fill="#e5e7eb">export async function retrieveEvidence(</text>
<text x="34" y="208" class="ln">46</text><text x="104" y="208" fill="#facc15">  question: string,</text>
<text x="34" y="232" class="ln">47</text><text x="104" y="232" fill="#facc15">  datasetIds: string[],</text>
<text x="34" y="256" class="ln">48</text><text x="104" y="256" fill="#e5e7eb">  access: AccessContext,</text>
<text x="34" y="280" class="ln">49</text><text x="104" y="280" fill="#e5e7eb">) {</text>
<text x="34" y="304" class="ln">50</text><text x="104" y="304" fill="#c084fc">  const response = await fetch('/api/v1/retrieval', {</text>
<text x="34" y="328" class="ln">51</text><text x="104" y="328" fill="#86efac">    method: 'POST',</text>
<text x="34" y="352" class="ln">52</text><text x="104" y="352" fill="#86efac">    credentials: 'include',</text>
<text x="34" y="376" class="ln">53</text><text x="104" y="376" fill="#e5e7eb">    headers: {</text>
<text x="34" y="400" class="ln">54</text><text x="104" y="400" fill="#86efac">      'Content-Type': 'application/json',</text>
<text x="34" y="424" class="ln">55</text><text x="104" y="424" fill="#86efac">      'X-ClaimTrace-User': access.userId,</text>
<text x="34" y="448" class="ln">56</text><text x="104" y="448" fill="#86efac">      'X-ClaimTrace-Scopes': access.scopes.join(','),</text>
<text x="34" y="472" class="ln">57</text><text x="104" y="472" fill="#e5e7eb">    },</text>
<text x="34" y="496" class="ln">58</text><text x="104" y="496" fill="#e5e7eb">    body: JSON.stringify({</text>
<text x="34" y="520" class="ln">59</text><text x="104" y="520" fill="#e5e7eb">      question,</text>
<text x="34" y="544" class="ln">60</text><text x="104" y="544" fill="#e5e7eb">      dataset_ids: datasetIds,</text>
<text x="34" y="568" class="ln">61</text><text x="104" y="568" fill="#e5e7eb">      page: 1,</text>
<text x="34" y="592" class="ln">62</text><text x="104" y="592" fill="#e5e7eb">      page_size: RETRIEVAL_LIMITS.candidateCount,</text>
<text x="34" y="616" class="ln">63</text><text x="104" y="616" fill="#e5e7eb">      top_k: RETRIEVAL_LIMITS.candidateCount,</text>
<text x="34" y="640" class="ln">64</text><text x="104" y="640" fill="#e5e7eb">      similarity_threshold: 0,</text>
<text x="34" y="664" class="ln">65</text><text x="104" y="664" fill="#e5e7eb">      vector_similarity_weight: 0.65,</text>
<text x="34" y="688" class="ln">66</text><text x="104" y="688" fill="#e5e7eb">      highlight: false,</text>
<text x="34" y="712" class="ln">67</text><text x="104" y="712" fill="#e5e7eb">      reference_metadata: { include: true },</text>
<text x="34" y="736" class="ln">68</text><text x="104" y="736" fill="#e5e7eb">    }),</text>
<text x="34" y="760" class="ln">69</text><text x="104" y="760" fill="#e5e7eb">  });</text>
<text x="34" y="784" class="ln">70</text><text x="104" y="784" fill="#c084fc">  if (!response.ok) {</text>
<text x="34" y="808" class="ln">71</text><text x="104" y="808" fill="#86efac">    throw new Error(`知识库检索服务返回 HTTP ${response.status}；请确认当前工作区会话有效`);</text>
<text x="34" y="832" class="ln">72</text><text x="104" y="832" fill="#e5e7eb">  }</text>
<text x="34" y="856" class="ln">73</text><text x="104" y="856" fill="#c084fc">  const result = (await response.json()) as RetrievalResponse;</text>
<text x="34" y="880" class="ln">74</text><text x="104" y="880" fill="#c084fc">  if (result.code !== 0) throw new Error(result.message || '知识库检索失败');</text>
<text x="34" y="904" class="ln">75</text><text x="104" y="904" fill="#c084fc">  const chunks = result.data?.chunks || [];</text>
<text x="34" y="928" class="ln">76</text><text x="104" y="928" fill="#c084fc">  const candidates: Evidence[] = chunks.map((chunk, index) =&gt; {</text>
<text x="34" y="952" class="ln">77</text><text x="104" y="952" fill="#c084fc">    const metadata = chunk.document_metadata || chunk.metadata || {};</text>
<text x="34" y="976" class="ln">78</text><text x="104" y="976" fill="#c084fc">    const requiredScopes = asStringArray(metadata.required_scopes || metadata.permission_scopes);</text>
<text x="34" y="1000" class="ln">79</text><text x="104" y="1000" fill="#c084fc">    const admissionScopes = asStringArray(metadata.admission_scopes || metadata.acl_scopes);</text>
<text x="34" y="1024" class="ln">80</text><text x="104" y="1024" fill="#c084fc">    const pageNumbers = chunk.page_num_int;</text>
<text x="34" y="1048" class="ln">81</text><text x="104" y="1048" fill="#c084fc">    return {</text>
<text x="34" y="1072" class="ln">82</text><text x="104" y="1072" fill="#86efac">      id: `E${index + 1}`,</text>
<text x="34" y="1096" class="ln">83</text><text x="104" y="1096" fill="#86efac">      title: chunk.document_keyword || `检索片段 ${index + 1}`,</text>
<text x="34" y="1120" class="ln">84</text><text x="104" y="1120" fill="#86efac">      source: chunk.document_id || chunk.chunk_id || '',</text>
<text x="34" y="1144" class="ln">85</text><text x="104" y="1144" fill="#86efac">      text: chunk.content || chunk.content_ltks || '',</text>
<text x="34" y="1168" class="ln">86</text><text x="104" y="1168" fill="#e5e7eb">      x: 0,</text>
<text x="34" y="1192" class="ln">87</text><text x="104" y="1192" fill="#e5e7eb">      y: 0,</text>
<text x="34" y="1216" class="ln">88</text><text x="104" y="1216" fill="#e5e7eb">      score: Number(chunk.similarity) || 0,</text>
<text x="34" y="1240" class="ln">89</text><text x="104" y="1240" fill="#e5e7eb">      docId: chunk.document_id,</text>
<text x="34" y="1264" class="ln">90</text><text x="104" y="1264" fill="#e5e7eb">      kbId: chunk.dataset_id,</text>
<text x="34" y="1288" class="ln">91</text><text x="104" y="1288" fill="#e5e7eb">      chunkId: chunk.chunk_id,</text>
<text x="34" y="1312" class="ln">92</text><text x="104" y="1312" fill="#e5e7eb">      imageId: chunk.image_id,</text>
<text x="34" y="1336" class="ln">93</text><text x="104" y="1336" fill="#e5e7eb">      pageNumbers,</text>
<text x="34" y="1360" class="ln">94</text><text x="104" y="1360" fill="#e5e7eb">      position: chunk.positions,</text>
<text x="34" y="1384" class="ln">95</text><text x="104" y="1384" fill="#86efac">      createdAt: typeof metadata.create_time === 'string' ? metadata.create_time : undefined,</text>
<text x="34" y="1408" class="ln">96</text><text x="104" y="1408" fill="#86efac">      effectiveAt: typeof metadata.effective_at === 'string' ? metadata.effective_at : undefined,</text>
<text x="34" y="1432" class="ln">97</text><text x="104" y="1432" fill="#86efac">      version: typeof metadata.version === 'string' ? metadata.version : undefined,</text>
<text x="34" y="1456" class="ln">98</text><text x="104" y="1456" fill="#86efac">      clauseKey: typeof metadata.clause_key === 'string' ? metadata.clause_key : undefined,</text>
<text x="34" y="1480" class="ln">99</text><text x="104" y="1480" fill="#e5e7eb">      canonicalSourceId:</text>
<text x="34" y="1504" class="ln">100</text><text x="104" y="1504" fill="#86efac">        typeof metadata.source_document_id === 'string'</text>
<text x="34" y="1528" class="ln">101</text><text x="104" y="1528" fill="#e5e7eb">          ? metadata.source_document_id</text>
<text x="34" y="1552" class="ln">102</text><text x="104" y="1552" fill="#e5e7eb">          : undefined,</text>
<text x="34" y="1576" class="ln">103</text><text x="104" y="1576" fill="#e5e7eb">      hierarchicalTitles: asStringArray(metadata.hierarchical_titles || metadata.section_path),</text>
<text x="34" y="1600" class="ln">104</text><text x="104" y="1600" fill="#86efac">      permissionLabel: typeof metadata.permission_label === 'string' ? metadata.permission_label : undefined,</text>
<text x="34" y="1624" class="ln">105</text><text x="104" y="1624" fill="#e5e7eb">      admissionScopes,</text>
<text x="34" y="1648" class="ln">106</text><text x="104" y="1648" fill="#e5e7eb">      requiredScopes,</text>
<text x="34" y="1672" class="ln">107</text><text x="104" y="1672" fill="#e5e7eb">      accessAllowed: true,</text>
<text x="34" y="1696" class="ln">108</text><text x="104" y="1696" fill="#e5e7eb">      metrics: {</text>
<text x="34" y="1720" class="ln">109</text><text x="104" y="1720" fill="#e5e7eb">        semantic: Number(chunk.vector_similarity) || 0,</text>
<text x="34" y="1744" class="ln">110</text><text x="104" y="1744" fill="#e5e7eb">        bm25: Number(chunk.bm25) || 0,</text>
<text x="34" y="1768" class="ln">111</text><text x="104" y="1768" fill="#e5e7eb">        bm25Normalized: Number(chunk.bm25_normalized) || 0,</text>
<text x="34" y="1792" class="ln">112</text><text x="104" y="1792" fill="#e5e7eb">        freshness: Number(chunk.freshness) || 0,</text>
<text x="34" y="1816" class="ln">113</text><text x="104" y="1816" fill="#e5e7eb">        titleCoverage: Number(chunk.title_coverage) || 0,</text>
<text x="34" y="1840" class="ln">114</text><text x="104" y="1840" fill="#e5e7eb">        combined: Number(chunk.similarity) || 0,</text>
<text x="34" y="1864" class="ln">115</text><text x="104" y="1864" fill="#e5e7eb">      },</text>
<text x="34" y="1888" class="ln">116</text><text x="104" y="1888" fill="#e5e7eb">      relations: [],</text>
<text x="34" y="1912" class="ln">117</text><text x="104" y="1912" fill="#e5e7eb">    };</text>
<text x="34" y="1936" class="ln">118</text><text x="104" y="1936" fill="#e5e7eb">  });</text>
<text x="34" y="1960" class="ln">119</text><text x="104" y="1960" fill="#e5e7eb"> </text>
<text x="34" y="1984" class="ln">120</text><text x="104" y="1984" fill="#7dd3fc">  // Admission filtering happens before graph construction. The same permissions are checked</text>
<text x="34" y="2008" class="ln">121</text><text x="104" y="2008" fill="#7dd3fc">  // again when edges are initialized because an access grant may change during a long run.</text>
<text x="34" y="2032" class="ln">122</text><text x="104" y="2032" fill="#c084fc">  const admitted = candidates.filter((item) =&gt; hasAdmission(item, access));</text>
<text x="34" y="2056" class="ln">123</text><text x="104" y="2056" fill="#c084fc">  return {</text>
<text x="34" y="2080" class="ln">124</text><text x="104" y="2080" fill="#e5e7eb">    evidence: admitted,</text>
<text x="34" y="2104" class="ln">125</text><text x="104" y="2104" fill="#e5e7eb">    candidateCount: result.data?.candidate_count ?? chunks.length,</text>
<text x="34" y="2128" class="ln">126</text><text x="104" y="2128" fill="#e5e7eb">    queryTokens: tokenize(question),</text>
<text x="34" y="2152" class="ln">127</text><text x="104" y="2152" fill="#e5e7eb">    filteredCount:</text>
<text x="34" y="2176" class="ln">128</text><text x="104" y="2176" fill="#e5e7eb">      (result.data?.permission_filtered_documents || 0) + candidates.length - admitted.length,</text>
<text x="34" y="2200" class="ln">129</text><text x="104" y="2200" fill="#e5e7eb">  };</text>
<text x="34" y="2224" class="ln">130</text><text x="104" y="2224" fill="#e5e7eb">}</text>
  </g>
</svg>