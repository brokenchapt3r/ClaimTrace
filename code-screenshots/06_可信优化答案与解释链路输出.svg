  <text x="132" y="62" fill="#f8fafc" font-size="22" font-family="Arial, sans-serif" font-weight="700">可信优化答案与解释链路输出</text>
  <text x="34" y="92" fill="#94a3b8" font-size="15" font-family="Arial, sans-serif">ClaimTrace processing modules</text>
  <g font-family="Consolas, monospace" font-size="16" xml:space="preserve">
    <style>.ln{fill:#64748b;text-anchor:end}</style>
<text x="34" y="112" class="ln"></text><text x="104" y="112" fill="#7dd3fc">// web/src/core/optimizer.ts</text>
<text x="34" y="136" class="ln">91</text><text x="104" y="136" fill="#e5e7eb">    }</text>
<text x="34" y="160" class="ln">92</text><text x="104" y="160" fill="#e5e7eb">  });</text>
<text x="34" y="184" class="ln">93</text><text x="104" y="184" fill="#c084fc">  return selected;</text>
<text x="34" y="208" class="ln">94</text><text x="104" y="208" fill="#e5e7eb">}</text>
<text x="34" y="232" class="ln">95</text><text x="104" y="232" fill="#e5e7eb"> </text>
<text x="34" y="256" class="ln">96</text><text x="104" y="256" fill="#c084fc">function seededRandom(seedText: string) {</text>
<text x="34" y="280" class="ln">97</text><text x="104" y="280" fill="#c084fc">  let state = Array.from(seedText).reduce(</text>
<text x="34" y="304" class="ln">98</text><text x="104" y="304" fill="#e5e7eb">    (seed, character) =&gt; Math.imul(seed ^ (character.codePointAt(0) || 0), 16_777_619),</text>
<text x="34" y="328" class="ln">99</text><text x="104" y="328" fill="#e5e7eb">    2_166_136_261,</text>
<text x="34" y="352" class="ln">100</text><text x="104" y="352" fill="#e5e7eb">  );</text>
<text x="34" y="376" class="ln">101</text><text x="104" y="376" fill="#c084fc">  return () =&gt; {</text>
<text x="34" y="400" class="ln">102</text><text x="104" y="400" fill="#e5e7eb">    state += 0x6d2b79f5;</text>
<text x="34" y="424" class="ln">103</text><text x="104" y="424" fill="#c084fc">    let value = state;</text>
<text x="34" y="448" class="ln">104</text><text x="104" y="448" fill="#e5e7eb">    value = Math.imul(value ^ (value &gt;&gt;&gt; 15), value | 1);</text>
<text x="34" y="472" class="ln">105</text><text x="104" y="472" fill="#e5e7eb">    value ^= value + Math.imul(value ^ (value &gt;&gt;&gt; 7), value | 61);</text>
<text x="34" y="496" class="ln">106</text><text x="104" y="496" fill="#c084fc">    return ((value ^ (value &gt;&gt;&gt; 14)) &gt;&gt;&gt; 0) / 4_294_967_296;</text>
<text x="34" y="520" class="ln">107</text><text x="104" y="520" fill="#e5e7eb">  };</text>
<text x="34" y="544" class="ln">108</text><text x="104" y="544" fill="#e5e7eb">}</text>
<text x="34" y="568" class="ln">109</text><text x="104" y="568" fill="#e5e7eb"> </text>
<text x="34" y="592" class="ln">110</text><text x="104" y="592" fill="#e5e7eb">export function optimizeGraph(</text>
<text x="34" y="616" class="ln">111</text><text x="104" y="616" fill="#facc15">  claims: Claim[],</text>
<text x="34" y="640" class="ln">112</text><text x="104" y="640" fill="#facc15">  evidence: Evidence[],</text>
<text x="34" y="664" class="ln">113</text><text x="104" y="664" fill="#facc15">  claimStatus: Record&lt;string, ClaimStatus&gt;,</text>
<text x="34" y="688" class="ln">114</text><text x="104" y="688" fill="#e5e7eb">  budgetMs = 50,</text>
<text x="34" y="712" class="ln">115</text><text x="104" y="712" fill="#e5e7eb">): OptimizationResult {</text>
<text x="34" y="736" class="ln">116</text><text x="104" y="736" fill="#c084fc">  const started = performance.now();</text>
<text x="34" y="760" class="ln">117</text><text x="104" y="760" fill="#c084fc">  const fallback = claims.length &gt; 15 || evidence.length &gt; 12 || claims.length * evidence.length &gt; 180;</text>
<text x="34" y="784" class="ln">118</text><text x="104" y="784" fill="#c084fc">  const initial = initialSelection(claims, claimStatus, evidence);</text>
<text x="34" y="808" class="ln">119</text><text x="104" y="808" fill="#c084fc">  if (fallback || !isFeasible(claims, claimStatus, initial, evidence)) {</text>
<text x="34" y="832" class="ln">120</text><text x="104" y="832" fill="#c084fc">    return {</text>
<text x="34" y="856" class="ln">121</text><text x="104" y="856" fill="#e5e7eb">      claimStatus: { ...claimStatus },</text>
<text x="34" y="880" class="ln">122</text><text x="104" y="880" fill="#e5e7eb">      selectedEdgeIds: [...initial],</text>
<text x="34" y="904" class="ln">123</text><text x="104" y="904" fill="#e5e7eb">      objective: objective(claimStatus, initial, evidence),</text>
<text x="34" y="928" class="ln">124</text><text x="104" y="928" fill="#e5e7eb">      elapsedMs: performance.now() - started,</text>
<text x="34" y="952" class="ln">125</text><text x="104" y="952" fill="#e5e7eb">      fallback: true,</text>
<text x="34" y="976" class="ln">126</text><text x="104" y="976" fill="#e5e7eb">    };</text>
<text x="34" y="1000" class="ln">127</text><text x="104" y="1000" fill="#e5e7eb">  }</text>
<text x="34" y="1024" class="ln">128</text><text x="104" y="1024" fill="#e5e7eb"> </text>
<text x="34" y="1048" class="ln">129</text><text x="104" y="1048" fill="#c084fc">  let best = initial;</text>
<text x="34" y="1072" class="ln">130</text><text x="104" y="1072" fill="#c084fc">  let bestObjective = objective(claimStatus, best, evidence);</text>
<text x="34" y="1096" class="ln">131</text><text x="104" y="1096" fill="#c084fc">  const candidates = allRelations(evidence).filter((edge) =&gt; edge.active);</text>
<text x="34" y="1120" class="ln">132</text><text x="104" y="1120" fill="#c084fc">  const random = seededRandom(candidates.map((edge) =&gt; edge.id).join('|'));</text>
<text x="34" y="1144" class="ln">133</text><text x="104" y="1144" fill="#c084fc">  while (performance.now() - started &lt; budgetMs &amp;&amp; candidates.length &gt; 0) {</text>
<text x="34" y="1168" class="ln">134</text><text x="104" y="1168" fill="#c084fc">    const candidate = candidates[Math.floor(random() * candidates.length)];</text>

<text x="34" y="1216" class="ln"></text><text x="104" y="1216" fill="#7dd3fc">// web/src/core/rewrite.ts</text>
<text x="34" y="1240" class="ln">8</text><text x="104" y="1240" fill="#e5e7eb">export function rewriteAnswer(</text>
<text x="34" y="1264" class="ln">9</text><text x="104" y="1264" fill="#facc15">  claims: Claim[],</text>
<text x="34" y="1288" class="ln">10</text><text x="104" y="1288" fill="#facc15">  evidence: Evidence[],</text>
<text x="34" y="1312" class="ln">11</text><text x="104" y="1312" fill="#facc15">  status: Record&lt;string, ClaimStatus&gt;,</text>
<text x="34" y="1336" class="ln">12</text><text x="104" y="1336" fill="#facc15">  selectedEdgeIds: string[],</text>
<text x="34" y="1360" class="ln">13</text><text x="104" y="1360" fill="#e5e7eb">  dependencies: ClaimDependency[] = [],</text>
<text x="34" y="1384" class="ln">14</text><text x="104" y="1384" fill="#e5e7eb">) {</text>
<text x="34" y="1408" class="ln">15</text><text x="104" y="1408" fill="#c084fc">  const selected = new Set(selectedEdgeIds);</text>
<text x="34" y="1432" class="ln">16</text><text x="104" y="1432" fill="#c084fc">  const explanations: Record&lt;string, string&gt; = {};</text>
<text x="34" y="1456" class="ln">17</text><text x="104" y="1456" fill="#c084fc">  const lines = claims.map((claim) =&gt; {</text>
<text x="34" y="1480" class="ln">18</text><text x="104" y="1480" fill="#c084fc">    const linked = evidence.flatMap((item) =&gt;</text>
<text x="34" y="1504" class="ln">19</text><text x="104" y="1504" fill="#e5e7eb">      item.relations.filter((edge) =&gt; edge.claimId === claim.id &amp;&amp; selected.has(edge.id)),</text>
<text x="34" y="1528" class="ln">20</text><text x="104" y="1528" fill="#e5e7eb">    );</text>
<text x="34" y="1552" class="ln">21</text><text x="104" y="1552" fill="#c084fc">    const supports = linked.filter((edge) =&gt; edge.type === 'support');</text>
<text x="34" y="1576" class="ln">22</text><text x="104" y="1576" fill="#c084fc">    const conflicts = linked.filter((edge) =&gt; edge.type === 'conflict');</text>
<text x="34" y="1600" class="ln">23</text><text x="104" y="1600" fill="#c084fc">    const state = status[claim.id];</text>
<text x="34" y="1624" class="ln">24</text><text x="104" y="1624" fill="#e5e7eb"> </text>
<text x="34" y="1648" class="ln">25</text><text x="104" y="1648" fill="#c084fc">    if (state === 'SUPPORTED') {</text>
<text x="34" y="1672" class="ln">26</text><text x="104" y="1672" fill="#86efac">      explanations[claim.id] = `所有语义成分均被选中的支持边覆盖：${supports.map((edge) =&gt; edge.reason).join('；')}`;</text>
<text x="34" y="1696" class="ln">27</text><text x="104" y="1696" fill="#c084fc">      return `${claim.atom}${citations(supports)}`;</text>
<text x="34" y="1720" class="ln">28</text><text x="104" y="1720" fill="#e5e7eb">    }</text>
<text x="34" y="1744" class="ln">29</text><text x="104" y="1744" fill="#c084fc">    if (state === 'PARTIALLY_SUPPORTED') {</text>
<text x="34" y="1768" class="ln">30</text><text x="104" y="1768" fill="#c084fc">      const missing = claim.missingComponents.join('、') || '未覆盖事实成分';</text>
<text x="34" y="1792" class="ln">31</text><text x="104" y="1792" fill="#86efac">      explanations[claim.id] = `已覆盖部分语义成分，仍缺少：${missing}。`;</text>
<text x="34" y="1816" class="ln">32</text><text x="104" y="1816" fill="#c084fc">      return `${claim.atom}${citations(supports)}（仅部分得到证据支持；缺少：${missing}）`;</text>
<text x="34" y="1840" class="ln">33</text><text x="104" y="1840" fill="#e5e7eb">    }</text>
<text x="34" y="1864" class="ln">34</text><text x="104" y="1864" fill="#c084fc">    if (state === 'CONFLICTED') {</text>
<text x="34" y="1888" class="ln">35</text><text x="104" y="1888" fill="#c084fc">      const supportSide = supports.length ? citations(supports) : '无已选支持证据';</text>
<text x="34" y="1912" class="ln">36</text><text x="104" y="1912" fill="#c084fc">      const conflictSide = conflicts.length ? citations(conflicts) : '无可公开冲突证据';</text>
<text x="34" y="1936" class="ln">37</text><text x="104" y="1936" fill="#c084fc">      const exclusions = dependencies</text>
<text x="34" y="1960" class="ln">38</text><text x="104" y="1960" fill="#86efac">        .filter((edge) =&gt; edge.type === 'exclusion' &amp;&amp; (edge.from === claim.id || edge.to === claim.id))</text>
<text x="34" y="1984" class="ln">39</text><text x="104" y="1984" fill="#e5e7eb">        .map((edge) =&gt; edge.from === claim.id ? edge.to : edge.from);</text>
<text x="34" y="2008" class="ln">40</text><text x="104" y="2008" fill="#86efac">      explanations[claim.id] = conflicts.map((edge) =&gt; edge.reason).join('；') ||</text>
<text x="34" y="2032" class="ln">41</text><text x="104" y="2032" fill="#86efac">        (exclusions.length ? `与声明 ${exclusions.join('、')} 互斥，按支持强度执行降级。` : '存在达到门限的冲突关系。');</text>
<text x="34" y="2056" class="ln">42</text><text x="104" y="2056" fill="#c084fc">      return `关于“${claim.atom}”，现有来源不一致：支持侧 ${supportSide}，冲突侧 ${conflictSide}，需进一步复核。`;</text>
<text x="34" y="2080" class="ln">43</text><text x="104" y="2080" fill="#e5e7eb">    }</text>
<text x="34" y="2104" class="ln">44</text><text x="104" y="2104" fill="#c084fc">    if (state === 'NO_PERMISSION') {</text>
<text x="34" y="2128" class="ln">45</text><text x="104" y="2128" fill="#86efac">      explanations[claim.id] = '相关证据在当前访问范围外，关联边已在权限复核阶段停用。';</text>
<text x="34" y="2152" class="ln">46</text><text x="104" y="2152" fill="#c084fc">      return `关于“${claim.atom}”，当前访问权限不足，无法基于受限材料给出结论。`;</text>
<text x="34" y="2176" class="ln">47</text><text x="104" y="2176" fill="#e5e7eb">    }</text>
<text x="34" y="2200" class="ln">48</text><text x="104" y="2200" fill="#c084fc">    const invalidPremises = dependencies</text>
<text x="34" y="2224" class="ln">49</text><text x="104" y="2224" fill="#86efac">      .filter((edge) =&gt; edge.to === claim.id &amp;&amp; edge.type !== 'exclusion')</text>
<text x="34" y="2248" class="ln">50</text><text x="104" y="2248" fill="#e5e7eb">      .map((edge) =&gt; edge.from)</text>
<text x="34" y="2272" class="ln">51</text><text x="104" y="2272" fill="#86efac">      .filter((id) =&gt; ['CONFLICTED', 'ABSTAINED', 'NO_PERMISSION'].includes(status[id]));</text>
<text x="34" y="2296" class="ln">52</text><text x="104" y="2296" fill="#e5e7eb">    explanations[claim.id] = invalidPremises.length</text>
<text x="34" y="2320" class="ln">53</text><text x="104" y="2320" fill="#86efac">      ? `前提声明 ${invalidPremises.join('、')} 无效，依赖约束阻止该结论继续采纳。`</text>
<text x="34" y="2344" class="ln">54</text><text x="104" y="2344" fill="#86efac">      : '当前可访问证据未形成足够的支持或冲突关系。';</text>
<text x="34" y="2368" class="ln">55</text><text x="104" y="2368" fill="#c084fc">    return `关于“${claim.atom}”，当前证据不足，暂不作确定结论。`;</text>
<text x="34" y="2392" class="ln">56</text><text x="104" y="2392" fill="#e5e7eb">  });</text>
<text x="34" y="2416" class="ln">57</text><text x="104" y="2416" fill="#c084fc">  return { answer: lines.join('\n\n'), explanations };</text>
<text x="34" y="2440" class="ln">58</text><text x="104" y="2440" fill="#e5e7eb">}</text>
  </g>
</svg>