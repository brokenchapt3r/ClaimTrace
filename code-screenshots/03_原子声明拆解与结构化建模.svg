<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#e5e7eb"/>
  <rect x="24" y="24" width="1452" height="1042" rx="18" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="58" cy="56" r="7" fill="#ef4444"/>
  <circle cx="82" cy="56" r="7" fill="#f59e0b"/>
  <circle cx="106" cy="56" r="7" fill="#22c55e"/>
  <text x="132" y="62" fill="#f8fafc" font-size="22" font-family="Arial, sans-serif" font-weight="700">原子声明拆解与结构化建模</text>
  <text x="34" y="92" fill="#94a3b8" font-size="15" font-family="Arial, sans-serif">ClaimTrace processing modules</text>
  <g font-family="Consolas, monospace" font-size="16" xml:space="preserve">
    <style>.ln{fill:#64748b;text-anchor:end}</style>
<text x="34" y="112" class="ln"></text><text x="104" y="112" fill="#7dd3fc">// web/src/adapters/model.ts</text>
<text x="34" y="136" class="ln">166</text><text x="104" y="136" fill="#facc15">  async parseClaims(draft: string) {</text>
<text x="34" y="160" class="ln">167</text><text x="104" y="160" fill="#c084fc">    const parsed = await this.completeJson&lt;{ claims?: ParsedClaim[]; dependencies?: ParsedDependency[] }&gt;(</text>
<text x="34" y="184" class="ln">168</text><text x="104" y="184" fill="#86efac">      '你是结构化事实解析器。只返回合法 JSON，不输出 Markdown。每个声明必须能够独立判断真伪。',</text>
<text x="34" y="208" class="ln">169</text><text x="104" y="208" fill="#86efac">      `把候选答案拆成最多 15 个原子声明，并抽取六元组字段。忽略证据编号、引用标记和排版标题，不要把同一事实重复表述。复合声明还要拆成可独立覆盖的语义成分。识别声明间的 premise、implication、exclusion 关系，索引从 1 开始。\n\n返回格式：{"claims":[{"text":"","subject":"","predicate":"","object":"","condition":"","time":"","components":[""]}],"dependencies":[{"from":1,"to":2,"type":"premise","confidence":0.0}]}\n\n候选答案：\n${draft}`,</text>
<text x="34" y="232" class="ln">170</text><text x="104" y="232" fill="#86efac">      { maxTokens: 8192, stage: 'claims' },</text>
<text x="34" y="256" class="ln">171</text><text x="104" y="256" fill="#e5e7eb">    );</text>
<text x="34" y="280" class="ln">172</text><text x="104" y="280" fill="#c084fc">    const rows = (parsed.claims || []).filter((item) =&gt; item.text?.trim()).slice(0, 15);</text>
<text x="34" y="304" class="ln">173</text><text x="104" y="304" fill="#c084fc">    if (rows.length === 0) throw new Error('模型未解析出原子声明');</text>
<text x="34" y="328" class="ln">174</text><text x="104" y="328" fill="#c084fc">    const claims: Claim[] = rows.map((item, index) =&gt; {</text>
<text x="34" y="352" class="ln">175</text><text x="104" y="352" fill="#c084fc">      const id = `C${index + 1}`;</text>
<text x="34" y="376" class="ln">176</text><text x="104" y="376" fill="#c084fc">      const components = (item.components?.filter(Boolean).length ? item.components : [item.text || '']) || [];</text>
<text x="34" y="400" class="ln">177</text><text x="104" y="400" fill="#c084fc">      return {</text>
<text x="34" y="424" class="ln">178</text><text x="104" y="424" fill="#e5e7eb">        id,</text>
<text x="34" y="448" class="ln">179</text><text x="104" y="448" fill="#86efac">        title: `声明 ${index + 1}`,</text>
<text x="34" y="472" class="ln">180</text><text x="104" y="472" fill="#86efac">        atom: item.text?.trim() || '',</text>
<text x="34" y="496" class="ln">181</text><text x="104" y="496" fill="#86efac">        subject: item.subject?.trim() || '',</text>
<text x="34" y="520" class="ln">182</text><text x="104" y="520" fill="#86efac">        predicate: item.predicate?.trim() || '',</text>
<text x="34" y="544" class="ln">183</text><text x="104" y="544" fill="#86efac">        object: item.object?.trim() || '',</text>
<text x="34" y="568" class="ln">184</text><text x="104" y="568" fill="#86efac">        condition: item.condition?.trim() || '',</text>
<text x="34" y="592" class="ln">185</text><text x="104" y="592" fill="#86efac">        time: item.time?.trim() || '',</text>
<text x="34" y="616" class="ln">186</text><text x="104" y="616" fill="#e5e7eb">        components: components.map((text, componentIndex) =&gt; ({</text>
<text x="34" y="640" class="ln">187</text><text x="104" y="640" fill="#86efac">          id: `${id}.S${componentIndex + 1}`,</text>
<text x="34" y="664" class="ln">188</text><text x="104" y="664" fill="#e5e7eb">          text: text.trim(),</text>
<text x="34" y="688" class="ln">189</text><text x="104" y="688" fill="#e5e7eb">        })),</text>
<text x="34" y="712" class="ln">190</text><text x="104" y="712" fill="#e5e7eb">        missingComponents: [],</text>
<text x="34" y="736" class="ln">191</text><text x="104" y="736" fill="#e5e7eb">        x: 0,</text>
<text x="34" y="760" class="ln">192</text><text x="104" y="760" fill="#e5e7eb">        y: 0,</text>
<text x="34" y="784" class="ln">193</text><text x="104" y="784" fill="#e5e7eb">      };</text>
<text x="34" y="808" class="ln">194</text><text x="104" y="808" fill="#e5e7eb">    });</text>
<text x="34" y="832" class="ln">195</text><text x="104" y="832" fill="#c084fc">    const dependencies: ClaimDependency[] = (parsed.dependencies || [])</text>
<text x="34" y="856" class="ln">196</text><text x="104" y="856" fill="#e5e7eb">      .map((item) =&gt; ({</text>
<text x="34" y="880" class="ln">197</text><text x="104" y="880" fill="#86efac">        from: `C${item.from || 0}`,</text>
<text x="34" y="904" class="ln">198</text><text x="104" y="904" fill="#86efac">        to: `C${item.to || 0}`,</text>
<text x="34" y="928" class="ln">199</text><text x="104" y="928" fill="#86efac">        type: item.type || 'premise',</text>
<text x="34" y="952" class="ln">200</text><text x="104" y="952" fill="#e5e7eb">        confidence: probability(item.confidence),</text>
<text x="34" y="976" class="ln">201</text><text x="104" y="976" fill="#e5e7eb">      }));</text>
<text x="34" y="1000" class="ln">202</text><text x="104" y="1000" fill="#c084fc">    return { claims, dependencies: makeAcyclic(claims.map((claim) =&gt; claim.id), dependencies) };</text>
<text x="34" y="1024" class="ln">203</text><text x="104" y="1024" fill="#e5e7eb">  }</text>
  </g>
</svg>