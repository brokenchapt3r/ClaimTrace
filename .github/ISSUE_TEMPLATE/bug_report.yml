name: Bug report
description: Report a reproducible ClaimTrace problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, private document text, and internal addresses before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release tag.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node.js version, and deployment mode.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
